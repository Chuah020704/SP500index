<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>S&P 500 AI DCA Workstation</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" data-i18n="titleEyebrow">AI DCA Dashboard</p>
          <h1 data-i18n="titleMain">S&P 500 Workstation</h1>
        </div>
        <button id="langToggle" class="ghost-button" type="button">中文</button>
      </header>

      <main id="app">
        <section class="card hero-card">
          <div class="loading" id="statusText">Loading workstation...</div>
        </section>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
