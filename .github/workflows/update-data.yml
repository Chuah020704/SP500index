name: Update market data snapshot

on:
  schedule:
    # Every 30 minutes, Mon-Fri (roughly covers pre-market through after-hours
    # US trading; the workstation itself skips the snapshot when it is stale).
    - cron: '*/30 * * * 1-5'
  push:
    # Bootstrap/refresh the snapshot as soon as this workflow (or the fetch
    # logic it depends on) lands on main, instead of waiting for the next
    # scheduled tick. Ignore changes to the generated snapshot itself so this
    # doesn't loop against the "Commit snapshot if changed" step below.
    branches: [main]
    paths-ignore:
      - 'data/sp500.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch S&P 500 snapshot
        run: node scripts/fetch-snapshot.js

      - name: Commit snapshot if changed
        run: |
          # `git diff` alone misses the first-ever run, where the file is
          # untracked rather than modified, so stage it first and diff the index.
          git add data/sp500.json
          if git diff --cached --quiet -- data/sp500.json; then
            echo "No data changes, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh S&P 500 data snapshot"
          git push
